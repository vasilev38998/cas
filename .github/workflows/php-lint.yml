name: Code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: candyclub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: |
          node --check arcade-symbols.js
          node --check arcade-game.js
          node --check sweet-arcade.js
          node --check mini-games.js
          node --check lobby.js
          node --check club.js
          node --check site-runtime.js
      - name: Smoke test current arcade engines
        run: |
          php -r '
          require "app/high_volatility_engines.php";
          require "app/precision_engines.php";
          require "app/sky_pantheon.php";
          require "app/feature_slots.php";
          $engines=["hv_fruit","hv3_temple","hv_jungle","hv_crystal","hv_scroll","hv3_neon","hv_sky","hv_curtains","hv_mystery"];
          foreach($engines as $engine){
            for($i=0;$i<40;$i++){
              $free=0;$state=[];$result=$engine(10000,false,$free,$state);
              if(!is_array($result)||!isset($result["win"],$result["payload"])) throw new Exception("Bad result: ".$engine);
              if(!isset($result["payload"]["initial_grid"],$result["payload"]["steps"])) throw new Exception("Missing payload: ".$engine);
              $free=3;$state=[];$result=$engine(10000,true,$free,$state);
              if(!is_array($result)||!isset($result["win"],$result["payload"])) throw new Exception("Bad free result: ".$engine);
            }
            echo $engine." OK\n";
          }
          require "app/mini_games.php";
          foreach([3,5,8,10] as $m){for($k=1;$k<=5;$k++){if(mini_mines_multiplier($m,$k)<=1)throw new Exception("Bad mines multiplier");}}
          for($i=0;$i<100;$i++){if(mini_crash_point()<1)throw new Exception("Bad crash point");}
          echo "mini math OK\n";
          '
      - name: Report slot math sample
        run: php tools/simulate_math.php 1200
      - name: Report instant-game math
        run: php tools/simulate_instant_math.php
      - name: Prepare integration database
        run: |
          mysql -h127.0.0.1 -uroot -proot candyclub_test < schema.sql
          cat > app/config.php <<'PHP'
          <?php
          return [
            'db' => ['host'=>'127.0.0.1','name'=>'candyclub_test','user'=>'root','pass'=>'root','charset'=>'utf8mb4'],
            'app' => ['name'=>'CandyClub CI','session_name'=>'candyclub_ci','starting_balance_kopecks'=>50000000,'admin_usernames'=>[],'admin_emails'=>[]],
          ];
          PHP
      - name: Exercise upgrade migration path
        run: |
          mysql -h127.0.0.1 -uroot -proot candyclub_test -e "DELETE FROM schema_migrations WHERE version='20260913_001_query_indexes'; ALTER TABLE game_rounds DROP INDEX idx_round_created, DROP INDEX idx_round_game_created; ALTER TABLE wallet_transactions DROP INDEX idx_wallet_user_type_ref;"
          php tools/migrate.php
          mysql -N -h127.0.0.1 -uroot -proot candyclub_test -e "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema=DATABASE() AND index_name IN ('idx_round_created','idx_round_game_created','idx_wallet_user_type_ref');" | grep -qx 3
      - name: Run database integration smoke test
        run: php tools/integration_smoke.php
